# Production defaults. Everything that varies per deployment comes from the environment
# (docs/architecture.md, "Configuration"): SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
# SPRING_DATASOURCE_PASSWORD, OIDC_ISSUER.
spring:
  application:
    name: partecipa-api
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      # The event publication table is created by a Flyway migration.
      jdbc:
        schema-initialization:
          enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}

server:
  # Every path of the API, operations included, is versioned (docs/routes.md).
  servlet:
    context-path: /api/v1
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
    path: /docs
  swagger-ui:
    enabled: false
    path: /docs/ui

partecipa:
  security:
    # Keycloak's audience mapper on the partecipa-web client adds this (infra/keycloak).
    audience: partecipa-api
